# STE writing checks. Run vale sync to download the pinned style.
StylesPath = .vale/styles
MinAlertLevel = warning
Packages = https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

# Project terms: .vale/styles/config/vocabularies/Project/accept.txt.
Vocab = Project

[*.md]
BasedOnStyles = STE
# Treat bold UI labels as technical names.
TokenIgnores = (\*\*[^*\n]+\*\*)

# Vale includes list items in paragraph counts. Use ste-cli STE-6.6 for paragraph length.
STE.ParagraphLength = NO
