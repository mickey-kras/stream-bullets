minimumReleaseAge: 10080
minimumReleaseAgeIgnoreMissingTime: false
trustLockfile: false
strictDepBuilds: true
allowBuilds:
  esbuild: true
  workerd: true
  sharp: true
verifyDepsBeforeRun: false
overrides:
  miniflare>undici: 7.30.1
  miniflare>sharp: 0.35.5
  '@esbuild-kit/core-utils>esbuild': 0.28.2
  'minimatch@10.2.6': 11.0.1
minimumReleaseAgeExclude:
  - minimatch@11.0.1
  - '@isaacs/nonrecursive-glob-match@1.0.1'
# Unpatched picomatch ReDoS (<= 4.0.7, no fixed release). Build and test tooling only.
# Remove when a patched picomatch ships.
auditConfig:
  ignoreGhsas:
    - GHSA-fc5q-39xc-vjpf
# Backport of the upstream fix for a race in the synchronous proxy channel (assertion "message?.id === id").
# Remove at the next miniflare update: pnpm stops the install when the version does not match.
patchedDependencies:
  miniflare@4.20260730.0: .github/patches/miniflare@4.20260730.0.patch
