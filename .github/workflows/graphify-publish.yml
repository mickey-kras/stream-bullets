name: Publish graph

# Pull requests never commit the graph. main publishes it as one orphan commit on the graph branch.
# Every push to main builds, so a run that finds main has moved always has a newer run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: graphify-publish
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned local graph tools
        run: python -m pip install --require-hashes -r .github/graphify/requirements.txt
      - name: Build the graph
        env:
          GRAPHIFY_BACKEND: none
          PYTHONHASHSEED: '0'
        run: python .github/graphify/snapshot.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: graph-${{ github.sha }}
          path: graphify-out/graph.json
          if-no-files-found: error
          retention-days: 1

  # Extraction has no write access. This job only replaces the graph branch.
  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: graph-${{ github.sha }}
          path: graph-artifact
      - name: Replace the graph branch
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          script: |
            const { readFileSync } = require("node:fs");
            const { data: main } = await github.rest.git.getRef({ ...context.repo, ref: "heads/main" });
            if (main.object.sha !== context.sha) {
              core.info("main moved; the newer run publishes the graph.");
              return;
            }
            const content = readFileSync("graph-artifact/graph.json").toString("base64");
            const { data: blob } = await github.rest.git.createBlob({ ...context.repo, content, encoding: "base64" });
            const { data: tree } = await github.rest.git.createTree({
              ...context.repo,
              tree: [{ path: "graph.json", mode: "100644", type: "blob", sha: blob.sha }],
            });
            const { data: commit } = await github.rest.git.createCommit({
              ...context.repo,
              message: `Graph for ${context.sha}`,
              tree: tree.sha,
              parents: [],
            });
            try {
              await github.rest.git.updateRef({ ...context.repo, ref: "heads/graph", sha: commit.sha, force: true });
            } catch (error) {
              if (error.status !== 422) throw error;
              await github.rest.git.createRef({ ...context.repo, ref: "refs/heads/graph", sha: commit.sha });
            }
            core.info(`Published ${commit.sha} for ${context.sha}`);
