name: Deploy to test

on:
  workflow_dispatch:
    inputs:
      revision:
        description: Full commit SHA to deploy from this repository
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: test
      url: https://test.streambullets.com
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - name: Validate revision
        env:
          REVISION: ${{ inputs.revision }}
        run: '[[ "$REVISION" =~ ^[a-f0-9]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.revision }}
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Require the test access runtime
        run: test -f app/server/test-environment.server.ts
      - run: pnpm build:test
      - name: Validate isolated deployment bindings
        run: node scripts/check-test-deployment.ts
      - name: Deploy isolated Worker
        env:
          CLOUDFLARE_ACCOUNT_ID: 4c8f932bbf73d6901fbb40f559f6e1f4
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
          TEST_ACCESS_SECRET: ${{ secrets.TEST_ACCESS_SECRET }}
          REVISION: ${{ inputs.revision }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs';
          const { BETTER_AUTH_SECRET, TEST_ACCESS_SECRET, RUNNER_TEMP } = process.env;
          if (!BETTER_AUTH_SECRET || BETTER_AUTH_SECRET.length < 32 || !TEST_ACCESS_SECRET || TEST_ACCESS_SECRET.length < 32 || BETTER_AUTH_SECRET === TEST_ACCESS_SECRET)
            throw new Error('Configure two distinct test-only secrets of at least 32 characters.');
          writeFileSync(`${RUNNER_TEMP}/test-secrets.json`, JSON.stringify({ BETTER_AUTH_SECRET, TEST_ACCESS_SECRET }), { mode: 0o600 });
          JS
          trap 'rm -f "$RUNNER_TEMP/test-secrets.json"' EXIT
          pnpm exec wrangler d1 migrations apply DB --env test --remote
          pnpm exec wrangler deploy --config build/server/wrangler.json --secrets-file "$RUNNER_TEMP/test-secrets.json" --var "DEPLOYED_COMMIT:$REVISION" --message "test commit $REVISION"
      - name: Verify deployed revision
        env:
          REVISION: ${{ inputs.revision }}
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 30 https://test.streambullets.com/__test --output /tmp/test-deployment.html
          grep -Fq "$REVISION" /tmp/test-deployment.html
          {
            echo 'Test URL: https://test.streambullets.com'
            echo "Commit: $REVISION"
            echo 'Role login and fixtures: https://test.streambullets.com/__test'
          } >> "$GITHUB_STEP_SUMMARY"
