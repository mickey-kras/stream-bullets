name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  static:
    name: Static application checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm lint
      - name: Check migrations match the schema
        run: |
          pnpm exec drizzle-kit generate --name schema_drift
          if [ -n "$(git status --porcelain -- drizzle)" ]; then
            git status --porcelain -- drizzle
            echo '::error::db/schema.ts has changes without a migration. Run pnpm db:generate and commit the result.'
            exit 1
          fi
      - name: Check third-party notices
        run: node scripts/third-party-notices.ts --check
      - run: pnpm audit --audit-level high

  unit:
    name: Unit coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      coverage-id: ${{ steps.coverage.outputs.artifact-id }}
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - run: node --test scripts/browser-coverage.test.ts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        id: coverage
        with:
          name: unit-coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  production:
    name: Production build validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:production
      - run: pnpm exec wrangler deploy --config build/server/wrangler.json --dry-run
      - run: pnpm build:test
      - run: node scripts/check-test-deployment.ts
      - run: pnpm exec wrangler deploy --config build/server/wrangler.json --dry-run

  browser:
    name: Browser tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          BROWSER_COVERAGE: "1"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e --shard=${{ matrix.shard }}/4
        env:
          BROWSER_COVERAGE: "1"
          BROWSER_COVERAGE_SHARD: "1"
      - name: Bind shard coverage to this revision
        env:
          REVISION: ${{ github.sha }}
        run: |
          printf '%s\n' "$REVISION" > coverage/browser/revision.txt
          cp -R blob-report coverage/browser/blob-report
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: browser-shard-${{ github.sha }}-${{ github.run_id }}-${{ matrix.shard }}
          path: coverage/browser/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: ${{ !cancelled() }}
        with:
          name: playwright-results-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.shard }}
          path: |
            blob-report/
            playwright-report/
            test-results/
          retention-days: 7

  verify:
    name: Verify application
    needs: [static, unit, production, browser]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      coverage-id: ${{ steps.coverage.outputs.artifact-id }}
    steps:
      - name: Require application checks
        env:
          STATIC: ${{ needs.static.result }}
          UNIT: ${{ needs.unit.result }}
          PRODUCTION: ${{ needs.production.result }}
          BROWSER: ${{ needs.browser.result }}
        run: test "$STATIC" = success && test "$UNIT" = success && test "$PRODUCTION" = success && test "$BROWSER" = success
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.unit.outputs.coverage-id }}
          path: coverage/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: browser-shard-${{ github.sha }}-${{ github.run_id }}-*
          path: coverage/shards/
      - name: Merge complete browser coverage
        env:
          REVISION: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
        run: |
          mkdir all-blob-reports
          for shard in 1 2 3 4; do
            directory="coverage/shards/browser-shard-$REVISION-$RUN_ID-$shard"
            test "$(cat "$directory/revision.txt")" = "$REVISION"
            cp "$directory"/blob-report/*.zip all-blob-reports/
          done
          node scripts/merge-browser-coverage.ts coverage/shards/browser-shard-"$REVISION"-"$RUN_ID"-{1,2,3,4}/raw
          test -s coverage/lcov.info
          test -s coverage/browser/lcov.info
          printf '%s\n' "$REVISION" > coverage/revision.txt
      - run: pnpm exec playwright merge-reports --reporter=html all-blob-reports
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7
      - name: Upload verified coverage
        id: coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: coverage-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            coverage/lcov.info
            coverage/browser/lcov.info
            coverage/revision.txt
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy production
    needs: [checks, sonar]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://streambullets.com
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:production
      - name: Check current main revision
        id: revision
        shell: bash
        run: |
          latest_sha=$(git ls-remote --exit-code origin refs/heads/main | cut -f1)
          if [ "$latest_sha" = "$GITHUB_SHA" ]; then
            echo 'deploy=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::This commit was superseded on main; deployment skipped.'
          fi
      - name: Migrate and deploy
        if: steps.revision.outputs.deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 4c8f932bbf73d6901fbb40f559f6e1f4
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || { echo '::error::Set CLOUDFLARE_API_TOKEN in the production environment.'; exit 1; }
          bookmark_info=$(pnpm exec wrangler d1 time-travel info DB --env production)
          printf '%s\n' "$bookmark_info"
          {
            echo '### D1 Time Travel bookmark before migrations'
            echo "Commit: \`$GITHUB_SHA\`"
            echo '```text'
            printf '%s\n' "$bookmark_info"
            echo '```'
            echo 'D1 restore steps: https://developers.cloudflare.com/d1/reference/time-travel/'
          } >> "$GITHUB_STEP_SUMMARY"
          pnpm exec wrangler d1 migrations apply DB --env production --remote
          pnpm exec wrangler deploy --config build/server/wrangler.json --message "commit $GITHUB_SHA"
      - name: Check production response and assets
        if: steps.revision.outputs.deploy == 'true'
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 https://streambullets.com/ --output /tmp/streambullets.html
          grep -Fq 'id="landing-title"' /tmp/streambullets.html
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 10 --max-time 30 https://streambullets.com/fonts.css --output /dev/null

  graphify:
    name: Graphify snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Install pinned local graph tools
        run: python -m pip install --require-hashes -r .github/graphify/requirements.txt
      - name: Test graph extraction
        run: python -m unittest discover -s .github/graphify -p 'test_*.py'
      # Every commit on main carries a graph that matches its sources.
      - name: Check the committed graph
        env:
          GRAPHIFY_BACKEND: none
          PYTHONHASHSEED: '0'
        run: python .github/graphify/snapshot.py --check

  checks:
    name: Required quality gates
    needs: [verify, quality, graphify]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all checks
        env:
          VERIFY: ${{ needs.verify.result }}
          QUALITY: ${{ needs.quality.result }}
          GRAPHIFY: ${{ needs.graphify.result }}
        run: test "$VERIFY" = success && test "$QUALITY" = success && test "$GRAPHIFY" = success

  sonar:
    name: SonarQube quality gate
    needs: [checks, verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require successful coverage artifact
        env:
          ARTIFACT_ID: ${{ needs.verify.outputs.coverage-id }}
        shell: bash
        run: '[[ "$ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          artifact-ids: ${{ needs.verify.outputs.coverage-id }}
          path: coverage/
      - name: Verify coverage revision
        run: test "$(cat coverage/revision.txt)" = "$GITHUB_SHA" && test -s coverage/lcov.info && test -s coverage/browser/lcov.info
      - name: Mask configured SonarQube endpoint
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python3 .github/scripts/mask-sonar-context.py configured
      - uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TAILSCALE_AUDIENCE }}
          tags: tag:github-sonar
          use-cache: 'true'
      - name: Mask advertised SonarQube endpoint
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python3 .github/scripts/mask-sonar-context.py advertised
      - uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Check SonarQube quality gate
        id: sonar-gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa
        timeout-minutes: 6
        with:
          pollingTimeoutSec: 270
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      - name: Synchronize SonarQube findings
        if: "!cancelled() && failure() && steps.sonar-gate.outcome == 'failure'"
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: python3 .github/scripts/sync-sonar-findings.py .scannerwork/report-task.txt
