# Block vulnerabilities here. Review licenses under SECURITY.md.
# CI checks runtime notices with scripts/third-party-notices.ts --check.
# Build tools, including caniuse-lite and lightningcss, do not ship.
fail-on-severity: high
vulnerability-check: true
license-check: false
warn-only: false
fail-on-scopes:
  - runtime
  - development
  - unknown
