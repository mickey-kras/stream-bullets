<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>body{padding:20px}.browse{width:540px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { TopicRow } = window.StreamBulletsDesignSystem_e1d9fa;

const topics = [
  { id: "1", title: "Can AI run my homelab?", category: "Tech & setups", likes: 142, dislikes: 18, comments: 2 },
  { id: "2", title: "Which game deserves a second chance?", category: "Gaming", likes: 96, dislikes: 12, comments: 0 },
  { id: "3", title: "Best tools for content creators right now?", category: "Just chatting", likes: 70, dislikes: 9, comments: 0 },
];

function List() {
  const [sel, setSel] = React.useState("1");
  return (
    <section className="browse" aria-label="Browse topics">
      <section id="topics" aria-label="Topics">
        {topics.map((t) => <TopicRow key={t.id} {...t} selected={sel === t.id} onClick={() => setSel(t.id)} />)}
      </section>
    </section>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<List />);
</script>
</body></html>
