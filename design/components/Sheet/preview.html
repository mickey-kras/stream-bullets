<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>body{padding:0;min-height:100vh}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Sheet } = window.StreamBulletsDesignSystem_e1d9fa;

function Demo() {
  const [open, setOpen] = React.useState(true);
  return (
    <main className="page-panel">
      <button type="button" className="gold" onClick={() => setOpen(true)}>
        Edit your page
      </button>
      <Sheet
        open={open}
        onOpenChange={setOpen}
        title="Edit your page"
        description="Change the name and the description of your page."
        onBack={() => {}}
        actions={
          <button type="submit" className="gold">
            Save
          </button>
        }
      >
        <p>Viewers see these details on your page and in the Streamers list.</p>
        <label>
          Page name
          <input defaultValue="Sunny" />
        </label>
        <label>
          Description
          <textarea rows={3} defaultValue="Tech, homelabs and late-night chats." />
        </label>
      </Sheet>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
