<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>body{padding:20px}.row{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-bottom:16px}.col{display:grid;gap:14px;min-width:0}.k{font:13px/1.3 var(--body);color:var(--muted)}.cell{display:grid;justify-items:center;gap:6px}.dlg{position:static;transform:none;width:auto;max-width:520px;max-height:none;box-shadow:none}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Select } = window.StreamBulletsDesignSystem_e1d9fa;
const categories = [
  { value: "Tech & setups", label: "Tech & setups", icon: "cat-tech" },
  { value: "Gaming", label: "Gaming", icon: "cat-gaming" },
  { value: "Creative", label: "Creative", icon: "cat-creative" },
  { value: "Just chatting", label: "Just chatting", icon: "cat-chatting" },
];
ReactDOM.createRoot(document.getElementById("root")).render(
  <div className="row" style={{ alignItems: "start", gap: 32 }}>
    <div className="field" style={{ width: 340, margin: 0 }}>
      <span className="field-label" id="cat-label">Category</span>
      <Select id="cat" labelledBy="cat-label" defaultValue="Tech & setups" options={categories} />
    </div>
    <div className="comment-sort" style={{ marginTop: 30 }}>
      <Select label="Sort comments" defaultValue="newest" options={[{ value: "newest", label: "Newest" }, { value: "oldest", label: "Oldest" }, { value: "top", label: "Top" }]} />
    </div>
  </div>
);
</script>
</body></html>
