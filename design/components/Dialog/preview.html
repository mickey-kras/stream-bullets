<!DOCTYPE html>

<style>body{padding:0;min-height:100vh}</style>

<div id="root"></div>
<script type="text/babel">
const { Dialog } = window.StreamBulletsDesignSystem_e1d9fa;

function Demo() {
  const [open, setOpen] = React.useState(true);
  return (
    <main className="page-panel">
      <button type="button" className="gold" onClick={() => setOpen(true)}>
        Report
      </button>
      <Dialog
        open={open}
        onOpenChange={setOpen}
        title="Report topic"
        description="Tell us what is wrong with “Can AI run my homelab?”."
        actions={
          <button type="submit" className="gold">
            Send report
          </button>
        }
      >
        <label>
          Details
          <textarea rows={3} placeholder="What should the moderators know?" />
        </label>
      </Dialog>
    </main>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
