<!-- @dsCard group="Topic board" height=1040 width=800 subtitle="Threads, replies, the answered mark, a translated comment and a reply box" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<style>body{padding:20px}.detail{max-width:780px}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Discussion, Thread, Comment, Composer } = window.StreamBulletsDesignSystem_e1d9fa;

function Liked(props) {
  const [liked, setLiked] = React.useState(false);
  return <Comment {...props} liked={liked} likes={(props.likes ?? 0) + (liked ? 1 : 0)} onLike={() => setLiked(!liked)} />;
}

function Demo() {
  const [reply, setReply] = React.useState(true);
  return (
    <section className="detail" aria-label="Discussion example">
      <Discussion>
        <Thread
          id="1"
          author="PixelLuna"
          comment={
            <Liked name="PixelLuna" preset={6} time="30 minutes ago" likes={4} answered={{ title: "Homelab Q&A", date: "11/21/2026", href: "#" }} onReply={() => setReply(true)}>
              Depends on what you want to do. For text and simple workflows it's totally doable. For bigger models you'll definitely feel the hardware limits.
            </Liked>
          }
          replies={[
            <Liked key="r1" name="Sunny" preset={14} time="20 minutes ago" replyTo={{ id: "1", name: "PixelLuna" }} edited onReply={() => setReply(true)}>
              <p>Same here. I will show my <strong>mini PC</strong> setup on Friday.</p>
            </Liked>,
          ]}
          replyBox={reply && <Composer replyingTo="PixelLuna" label="Write a reply to PixelLuna" placeholder="Write a reply…" onCancelReply={() => setReply(false)} />}
        />
        <Thread
          id="2"
          author="TechNomad"
          comment={
            <Liked name="TechNomad" preset={0} time="1 hour ago" translation={{ from: "German", original: "Ich nutze ein lokales Modell auf einem Mini-PC. Für kleine Aufgaben reicht es gut." }}>
              I use a local model on a mini PC. For small tasks it is good enough.
            </Liked>
          }
        />
        <Comment name="" removed />
      </Discussion>
    </section>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body></html>
